[project]
name = "codex-http-gateway"
version = "0.3.0"
description = "A persistent asynchronous HTTP gateway for the Codex CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "uvicorn>=0.34,<1"]

[project.scripts]
codex-gateway = "codex_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_gateway"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
